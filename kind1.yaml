# kind-cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    extraMounts:
      - hostPath: ./kind-storage1
        containerPath: /kind-storage1
    extraPortMappings:

      # Jenkins (if needed later)
      - containerPort: 30080
        hostPort: 8080
