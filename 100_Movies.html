<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top 100 Movies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        ul {
            max-width: 600px;
            margin: auto;
            padding: 0;
            list-style-type: none;
        }
        li {
            background: white;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px #ccc;
        }
    </style>
</head>
<body>

<h1>Empire's 100 Greatest Movies</h1>
<ul id="movie-list"></ul>

<script>
fetch("100_Movie_name.txt")
    .then(response => response.text())
    .then(data => {
        const movieList = document.getElementById("movie-list");
        const lines = data.split("\n");

        lines.forEach(line => {
            if (line.trim() !== "") {
                const li = document.createElement("li");
                li.textContent = line;
                movieList.appendChild(li);
            }
        });
    })
    .catch(error => {
        console.error("Error loading movie list:", error);
    });
</script>

</body>
</html>
