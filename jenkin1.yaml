apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins1
  template:
    metadata:
      labels:
        app: jenkins1
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: jenkins1
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080

          volumeMounts:
            - mountPath: /var/jenkins_home   # Jenkins data folder inside container
              name: jenkins-data        

      volumes:
      - name: jenkins-data
        persistentVolumeClaim:
          claimName: jenkins-pvc1
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins1
spec:
  type: NodePort
  selector:
    app: jenkins1
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
